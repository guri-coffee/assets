<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>オロチ — Three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f4f2ee;}
  #info{position:fixed;top:10px;left:12px;font:12px/1.6 sans-serif;color:#777;user-select:none;}
  #vars{position:fixed;top:10px;right:12px;display:flex;gap:6px;}
  #vars button{
    font:12px sans-serif;color:#333;background:#fff;border:1px solid #bbb;
    border-radius:4px;padding:5px 10px;cursor:pointer;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info">オロチ（三面図版） — drag: rotate / wheel: zoom / right-drag: pan</div>
<div id="vars"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ---------- palette（三面図からスポイト） ---------- */
const C = {
  bg:       0xf4f2ee,
  skinTop:  0xedf0ef,  // 体の白グレー（上・明）
  skinBot:  0xc7cbca,  // 体の白グレー（下・暗）— 縦グラデーション
  patch:    0xf9fbfa,  // ひし形うろこハイライト
  eye:      0xd42020,  // 虹彩の赤
  pupil:    0x8c1216,  // 瞳孔の暗赤
  mark:     0xb5502e,  // 額〜後頭部のすじ・目後ろの炎マーキング
  dark:     0x232323,  // 眉・口・鼻
  pink:     0xf0b6be,  // 口内のピンク
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(1.05, 0.85, 2.05);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.05, 0.42, 0);
controls.enableDamping = true;

/* ---------- lights（キー＋ヘミ＋リムの3灯。GLBには乗らない） ---------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8bcbb, 0.95));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.9);
sun.position.set(4, 8, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = sc.bottom = -3; sc.right = sc.top = 3; sc.far = 40;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.35);
rim.position.set(-6, 4, -8);
scene.add(rim);

/* ---------- helpers ---------- */
function mesh(geo, mat, parent){
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
/* 高さベースの縦グラデーションを頂点カラーで焼き込む（GLBに乗る） */
function applyGrad(geo, yBot, yTop){
  const p = geo.attributes.position;
  const cT = new THREE.Color(C.skinTop), cB = new THREE.Color(C.skinBot), c = new THREE.Color();
  const col = new Float32Array(p.count*3);
  for(let i=0; i<p.count; i++){
    const u = THREE.MathUtils.clamp((p.getY(i)-yBot)/(yTop-yBot), 0, 1);
    c.lerpColors(cB, cT, Math.pow(u, 0.8));
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}

/* ================= build =================
   三面図採寸: 全高1.0m / 頭は前後に長い（側面図） / 首半径0.11 /
   裾の膨らみ0.165 / 尻尾は土台を左→前→右へ巻いて右前で先細り。
   リグ前提の構成:
   - body: 首→胴→尻尾の先まで1本の連続チューブ（背骨直交エッジループ）
   - head: 変形楕円体の独立メッシュ（頭ボーン担当）
   - face: 顔パーツは頭サーフェス関数に追従する別オブジェクト群 */
const model = new THREE.Group();
model.name = 'orochi';
scene.add(model);

const skinMat  = new THREE.MeshStandardMaterial({ color:0xffffff, vertexColors:true, roughness:0.85 });
const smooth = (c, r=0.7) => new THREE.MeshStandardMaterial({ color:c, roughness:r });
const patchMat = smooth(C.patch, 0.9);
const eyeMat   = smooth(C.eye, 0.35);
const pupilMat = smooth(C.pupil, 0.3);
const markMat  = smooth(C.mark, 0.85);
const darkMat  = smooth(C.dark, 0.9);
const pinkMat  = smooth(C.pink, 0.8);
const glintMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.2, emissive:0xffffff, emissiveIntensity:0.4 });

/* ---- 頭サーフェス（三面図の頭部形状を1つの関数で定義） ----
   側面図: 縦より前後に長い / マズルは前に行くほど下がり・細くなる /
   クラウンの頂点はやや後ろ寄り / 顔はわずかに前傾 */
const HC = new THREE.Vector3(0, 0.795, 0.015);  // 頭の中心
const HR = 0.180;                               // 横半径
const HY = 1.02;                                // 縦比率
const HZ = 1.24;                                // 前後比率（側面図準拠で長め）
const TILT = 6 * Math.PI/180;                   // 前傾（鼻先が下がる）
const sstep = t => { t = THREE.MathUtils.clamp(t, 0, 1); return t*t*(3-2*t); };
function headSurf(dir){
  const c = HR*HZ;
  let x = dir.x*HR, y = dir.y*HR*HY, z = dir.z*c;
  /* 後頭部0→鼻先1へ連続に効かせる（クリースを作らない） */
  const f = Math.pow((z/c + 1)/2, 3);
  y -= 0.30*HR*f;                               // 前へ行くほど下がる（マズルの下がり）
  x *= 1 - 0.15*f;                              // 前細り（目が正面から見える程度に）
  const under = sstep(-y/(0.25*HR));
  y *= 1 - 0.18*f*under;                        // マズル下面（あご）を薄く・滑らかに
  /* クラウン（頭頂やや後ろ）の盛り */
  const g = Math.exp(-Math.pow((z/c + 0.45)/0.50, 2));
  y += 0.05*HR*g*sstep(y/(0.30*HR));
  /* 後頭部下側を首へ向けて絞る（首と滑らかに繋ぐ） */
  z *= 1 - 0.16*Math.max(0, -dir.y)*Math.max(0, -dir.z);
  /* 前傾チルト */
  const cy = Math.cos(TILT), sy = Math.sin(TILT);
  return new THREE.Vector3(x, y*cy - z*sy, z*cy + y*sy);
}
/* ---- 顔テクスチャ（三面図の顔を2Dで描いて頭に投影する。
        スタイライズド調の顔はジオメトリではなく絵で作るのが定石） ----
   UV: 等距円筒 u=0.5が正面(+Z)、v=0.5+pitch/180。px()で度→ピクセル変換 */
const TW = 2048, TH = 1024, D = TW/360;
const px = (yaw, pitch) => [(0.5 + yaw/360)*TW, (0.5 - pitch/180)*TH];
const cv = document.createElement('canvas');
cv.width = TW; cv.height = TH;
const ctx = cv.getContext('2d');
ctx.fillStyle = '#ffffff';                       // 肌色は頂点カラー側で乗算
ctx.fillRect(0, 0, TW, TH);
function ell(yaw, pitch, rxDeg, ryDeg, fill, rot=0){
  const [x, y] = px(yaw, pitch);
  ctx.beginPath();
  ctx.ellipse(x, y, rxDeg*D, ryDeg*D, rot, 0, Math.PI*2);
  ctx.fillStyle = fill; ctx.fill();
}
function poly(pts, fill){
  ctx.beginPath();
  pts.forEach((p, i) => { const [x, y] = px(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function strokePath(pts, wDeg, color){
  ctx.beginPath();
  pts.forEach((p, i) => { const [x, y] = px(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.lineWidth = wDeg*D; ctx.strokeStyle = color;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
const MARK = '#b5502e', DARK = '#232323';
for(const s of [-1, 1]){
  /* 目の後ろの炎マーキング（先に描いて目を上に重ねる） */
  poly([[44*s,3],[52*s,10],[62*s,13],[74*s,13],[87*s,10],[100*s,6],
        [87*s,4],[74*s,5.5],[62*s,5.5],[52*s,0],[44*s,-2]], MARK);
  /* 内目尻下の朱のしずく */
  poly([[20*s,-3],[26*s,-4],[28*s,-8],[23*s,-6.5],[19*s,-4.5]], MARK);
  /* 目: 黒輪郭→赤虹彩→上側暗赤→ハイライト2つ（三面図準拠） */
  const ex = 33*s, ey = 2;
  ell(ex, ey, 13.8, 16.6, '#1c1c1c');
  ell(ex, ey, 12.2, 15.0, '#d42020');
  ctx.save();
  { const [cx, cy] = px(ex, ey);
    ctx.beginPath(); ctx.ellipse(cx, cy, 12.2*D, 15.0*D, 0, 0, Math.PI*2); ctx.clip(); }
  ell(ex, ey - 8, 12.2, 12.0, '#8c1216');       // 上側を暗く（瞳の奥行き）
  ctx.restore();
  ell(ex - 4.2*s, ey + 5.5, 3.9, 4.6, '#ffffff');
  ell(ex + 4.2*s, ey - 6.0, 1.6, 1.9, '#ffd6d6');
  /* 困り眉 */
  strokePath([[14*s,28],[22*s,26.5],[31*s,21]], 1.7, DARK);
  /* 鼻の点 */
  ell(7*s, -4, 1.1, 1.3, DARK);
}
/* 口: 幅広のにっこり（口角が上がる）＋中央下の口内ピンク */
ell(0, -17.5, 4.4, 2.5, '#f0b6be');
strokePath([[-80,10],[-64,0],[-45,-7.5],[-23,-12],[0,-13.5],[23,-12],[45,-7.5],[64,0],[80,10]], 2.0, DARK);
const faceTex = new THREE.CanvasTexture(cv);
faceTex.colorSpace = THREE.SRGBColorSpace;
faceTex.anisotropy = 8;
const headMat = new THREE.MeshStandardMaterial({ map: faceTex, vertexColors: true, roughness: 0.85 });

{
  /* phiStart=270°でUV継ぎ目を後頭部に置く（顔面にシームを出さない） */
  const g = new THREE.SphereGeometry(1, 64, 48, Math.PI*1.5);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for(let i=0; i<p.count; i++){
    v.set(p.getX(i), p.getY(i), p.getZ(i)).normalize();
    const s = headSurf(v);
    p.setXYZ(i, s.x, s.y, s.z);
  }
  g.computeVertexNormals();
  g.translate(HC.x, HC.y, HC.z);
  applyGrad(g, -0.4, 1.0);
  const head = mesh(g, headMat, model);
  head.name = 'head';
}

/* ---- 背骨カーブ（あご下 t=0 → 尻尾の先 t=1。始点は頭の中に埋める） ---- */
const spine = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 0.00, 0.83,  0.000),   // 頭の中（接続部）
  new THREE.Vector3( 0.00, 0.64,  0.030),   // あご下
  new THREE.Vector3( 0.00, 0.51, -0.005),   // 首の反り
  new THREE.Vector3( 0.00, 0.38, -0.020),
  new THREE.Vector3( 0.00, 0.26,  0.020),   // 腹のふくらみ
  new THREE.Vector3( 0.00, 0.165, 0.010),   // 裾の中心
  new THREE.Vector3(-0.07, 0.160,-0.100),   // 尻尾: 左後ろへ（接地するようy=半径ぶん浮かす）
  new THREE.Vector3(-0.24, 0.135,-0.160),
  new THREE.Vector3(-0.37, 0.115,-0.010),   // 左横
  new THREE.Vector3(-0.31, 0.100, 0.170),   // 左前
  new THREE.Vector3(-0.04, 0.090, 0.265),   // 前中央
  new THREE.Vector3( 0.27, 0.070, 0.280),   // 前右へ
  new THREE.Vector3( 0.50, 0.040, 0.230),
  new THREE.Vector3( 0.64, 0.015, 0.170),   // 尻尾の先
]);

/* 半径プロファイル: 首（細）→裾（太）→巻き尾（先細り） */
const RKEYS = [
  [0.000, 0.150], [0.080, 0.115], [0.160, 0.108], [0.240, 0.125],
  [0.320, 0.158], [0.400, 0.165],
  [0.500, 0.140], [0.600, 0.115], [0.720, 0.090],
  [0.820, 0.065], [0.920, 0.038], [1.000, 0.005],
];
function radiusAt(t){
  for(let i=0; i<RKEYS.length-1; i++){
    const [a, ra] = RKEYS[i], [b, rb] = RKEYS[i+1];
    if(t >= a && t <= b){
      const u = (t-a)/(b-a), s = u*u*(3-2*u);
      return ra + (rb-ra)*s;
    }
  }
  return RKEYS[RKEYS.length-1][1];
}

function buildSnake(curve, rings, radial){
  /* Frenetフレームは急カーブ・ねじれで法線が暴れるため、
     平行移動フレーム（parallel transport）で安定した断面を作る */
  const pts = [], tans = [];
  for(let i=0; i<=rings; i++){
    const t = i/rings;
    pts.push(curve.getPointAt(t));
    tans.push(curve.getTangentAt(t).normalize());
  }
  let n = new THREE.Vector3(0,0,1);
  if(Math.abs(tans[0].dot(n)) > 0.9) n.set(1,0,0);
  n.addScaledVector(tans[0], -n.dot(tans[0])).normalize();
  const Ns = [], Bs = [];
  for(let i=0; i<=rings; i++){
    if(i > 0){
      const axis = new THREE.Vector3().crossVectors(tans[i-1], tans[i]);
      if(axis.length() > 1e-6){
        const ang = Math.acos(THREE.MathUtils.clamp(tans[i-1].dot(tans[i]), -1, 1));
        n.applyAxisAngle(axis.normalize(), ang);
      }
      n.addScaledVector(tans[i], -n.dot(tans[i])).normalize();
    }
    Ns.push(n.clone());
    Bs.push(new THREE.Vector3().crossVectors(tans[i], n));
  }
  const pos = [], idx = [];
  for(let i=0; i<=rings; i++){
    const t = i/rings;
    const p = pts[i];
    const N = Ns[i], B = Bs[i];
    const r = radiusAt(t);
    for(let j=0; j<=radial; j++){
      const a = j/radial * Math.PI*2;
      pos.push(
        p.x + (Math.cos(a)*N.x + Math.sin(a)*B.x) * r,
        p.y + (Math.cos(a)*N.y + Math.sin(a)*B.y) * r,
        p.z + (Math.cos(a)*N.z + Math.sin(a)*B.z) * r);
    }
  }
  for(let i=0; i<rings; i++){
    for(let j=0; j<radial; j++){
      const a = i*(radial+1)+j, b = a+radial+1;
      idx.push(a, a+1, b,  b, a+1, b+1);   // 外向き法線になる巻き順
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}
const body = mesh(applyGrad(buildSnake(spine, 160, 18), 0.0, 0.9), skinMat, model);
body.name = 'body';
/* 尻尾の先の穴をふさぐキャップ */
{
  const g = new THREE.SphereGeometry(0.008, 8, 6);
  g.translate(...spine.getPointAt(1).toArray());
  applyGrad(g, 0.0, 0.9);
  mesh(g, skinMat, model);
}

/* ---- 顔パーツ（頭サーフェス追従。頭ボーンに親子付け想定） ---- */
const face = new THREE.Group();
face.name = 'face';
model.add(face);

function hdir(yawDeg, pitchDeg){
  const y = yawDeg*Math.PI/180, p = pitchDeg*Math.PI/180;
  return new THREE.Vector3(Math.sin(y)*Math.cos(p), Math.sin(p), Math.cos(y)*Math.cos(p));
}
function surfPoint(yaw, pitch, depth=1.0){
  return headSurf(hdir(yaw, pitch)).multiplyScalar(depth).add(HC);
}
/* 実サーフェスの接ベクトルから法線を数値微分で求める */
function surfBasis(yaw, pitch){
  const e = 1.5;
  const p  = surfPoint(yaw, pitch);
  const du = surfPoint(yaw+e, pitch).sub(p.clone());
  const dv = surfPoint(yaw, pitch+e).sub(p.clone());
  const n = new THREE.Vector3().crossVectors(du, dv).normalize();
  if(n.dot(hdir(yaw, pitch)) < 0) n.negate();
  const up = dv.clone().normalize();
  const side = new THREE.Vector3().crossVectors(up, n).normalize();
  const upO = new THREE.Vector3().crossVectors(n, side).normalize();
  return { p, n, up:upO, side };
}
/* 表面に貼り付く扁平パーツ（+Z=法線 / +Y=表面沿いの上） */
function facePatch(mat, sx, sy, sz, yaw, pitch, off=0, name=''){
  const b = surfBasis(yaw, pitch);
  const m = mesh(new THREE.SphereGeometry(1, 20, 14), mat, face);
  m.position.copy(b.p).addScaledVector(b.n, off);
  m.scale.set(sx, sy, sz);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(b.side.negate(), b.up, b.n));
  if(name) m.name = name;
  return m;
}
/* 頭表面に沿うリボン（すじ・眉・口などの描き線用） */
function headRibbon(mat, path, halfW, lift=0.004, name=''){
  const N = 48;
  const curve2 = new THREE.SplineCurve(path.map(v => new THREE.Vector2(v[0], v[1])));
  const pts = [], nrms = [];
  for(let i=0; i<=N; i++){
    const yp = curve2.getPoint(i/N);
    const b = surfBasis(yp.x, yp.y);
    pts.push(b.p.clone().addScaledVector(b.n, lift));
    nrms.push(b.n);
  }
  const pos = [], idx = [];
  for(let i=0; i<=N; i++){
    const u = i/N;
    const tan = (i===0 ? pts[1].clone().sub(pts[0])
              : i===N ? pts[N].clone().sub(pts[N-1])
              : pts[i+1].clone().sub(pts[i-1])).normalize();
    const side = new THREE.Vector3().crossVectors(nrms[i], tan).normalize();
    const w = halfW(u);
    const a = pts[i].clone().addScaledVector(side, w);
    const b2 = pts[i].clone().addScaledVector(side, -w);
    pos.push(a.x, a.y, a.z, b2.x, b2.y, b2.z);
    if(i < N){ const k = i*2; idx.push(k, k+1, k+2,  k+1, k+3, k+2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const m = mesh(geo, mat, face);
  m.material = m.material.clone();
  m.material.side = THREE.DoubleSide;
  if(name) m.name = name;
  return m;
}
const taper = max => u => max * Math.pow(Math.sin(Math.PI*u), 0.7);

/* 目・眉・口・鼻・炎マーキングはすべて顔テクスチャ側で描画（上のCanvas参照）。
   ここでは立体のままにしたいパーツだけ残す */

/* 額→頭頂→後頭部の朱のすじ（頭頂を跨ぐためリボンのまま） */
headRibbon(markMat,
  [[0, 24], [0, 52], [0, 85], [0, 122], [0, 162]],
  taper(0.013), 0.0022, 'mark_crown');

/* ---- ひし形うろこハイライト（角丸ダイヤの薄押し出し） ---- */
function diamondGeo(s){
  const sh = new THREE.Shape();
  sh.moveTo(0, s); sh.lineTo(s, 0); sh.lineTo(0, -s); sh.lineTo(-s, 0); sh.closePath();
  return new THREE.ExtrudeGeometry(sh, {
    depth: 0.002, bevelEnabled: true, bevelSize: s*0.22, bevelThickness: 0.0015, bevelSegments: 2
  });
}
function headDiamond(s, yaw, pitch){
  const b = surfBasis(yaw, pitch);
  const m = mesh(diamondGeo(s), patchMat, face);
  m.position.copy(b.p).addScaledVector(b.n, -0.003);
  m.lookAt(b.p.clone().addScaledVector(b.n, 1));
  return m;
}
/* 額の左右クラスタ（すじを挟んで 左4・右3） */
for(const [yaw, pitch, s] of [[-16,48,0.015],[-26,42,0.013],[-16,37,0.013],[-26,52,0.011]]) headDiamond(s, yaw, pitch);
for(const [yaw, pitch, s] of [[ 17,46,0.015],[ 26,40,0.012],[ 19,35,0.011]]) headDiamond(s, yaw, pitch);

/* 体表面のひし形（胸・背中・首すじ） */
function bodyDiamond(s, t, dirWorld, lift=0.99){
  const p = spine.getPointAt(t), r = radiusAt(t);
  const tan = spine.getTangentAt(t);
  const d = dirWorld.clone().addScaledVector(tan, -dirWorld.dot(tan)).normalize();
  const m = mesh(diamondGeo(s), patchMat, model);
  m.position.copy(p).addScaledVector(d, r*lift);
  m.lookAt(p.clone().addScaledVector(d, r*3));
  return m;
}
const FWD = new THREE.Vector3(0,0,1), BACK = new THREE.Vector3(0,0,-1), LEFT = new THREE.Vector3(-1,0,0);
/* 胸（正面図: 大3＋下に小1） */
bodyDiamond(0.022, 0.205, FWD);
bodyDiamond(0.022, 0.235, new THREE.Vector3(-0.35,0,1).normalize());
bodyDiamond(0.020, 0.235, new THREE.Vector3( 0.35,0,1).normalize());
bodyDiamond(0.014, 0.265, new THREE.Vector3( 0.15,0,1).normalize());
/* 背中（背面図: 縦に3） */
bodyDiamond(0.016, 0.230, BACK);
bodyDiamond(0.014, 0.260, BACK);
bodyDiamond(0.012, 0.290, new THREE.Vector3(0.1,0,-1).normalize());
/* 首すじ左（側面図のクラスタ） */
bodyDiamond(0.013, 0.110, LEFT, 0.93);
bodyDiamond(0.011, 0.135, new THREE.Vector3(-1,0,0.3).normalize(), 0.93);

/* ---------- ground（GLBには含まれない） ---------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48),
  new THREE.MeshStandardMaterial({ color:0xeceae4, roughness:1 }));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ================= GLB export (Unity: glTFast / Blender) ================= */
{
  const b = document.createElement('button');
  b.textContent = 'GLB書き出し';
  b.style.background = '#4a6b3a';
  b.style.borderColor = '#6f9a58';
  b.style.color = '#fff';
  b.onclick = () => {
    /* キャラはスムーズシェーディングのまま書き出す（法線・頂点カラーは生成済み） */
    const clone = model.clone(true);
    clone.traverse(o => {
      if(o.isMesh){
        o.geometry = o.geometry.clone();
        o.castShadow = o.receiveShadow = false;
      }
    });
    new GLTFExporter().parse(clone, (buf) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], { type:'model/gltf-binary' }));
      a.download = 'orochi.glb';
      a.click();
      URL.revokeObjectURL(a.href);
    }, (err) => alert('書き出し失敗: ' + err), { binary:true });
  };
  document.getElementById('vars').appendChild(b);
}

/* ================= loop ================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
