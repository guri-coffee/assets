<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>オロチ — Three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f4f2ee;}
  #info{position:fixed;top:10px;left:12px;font:12px/1.6 sans-serif;color:#777;user-select:none;}
  #vars{position:fixed;top:10px;right:12px;display:flex;gap:6px;}
  #vars button{
    font:12px sans-serif;color:#333;background:#fff;border:1px solid #bbb;
    border-radius:4px;padding:5px 10px;cursor:pointer;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info">オロチ — drag: rotate / wheel: zoom / right-drag: pan</div>
<div id="vars"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ---------- palette（orochi_ref.png からスポイト） ---------- */
const C = {
  bg:      0xf4f2ee,
  body:    0xcdd1cd,  // 胴の明るいグレー
  face:    0xdfe3df,  // 頭部・腹側のさらに明るいグレー
  patch:   0xeef0ee,  // うろこのひし形ハイライト
  eye:     0xd42020,  // 虹彩の赤
  pupil:   0x7c1216,  // 瞳孔の暗赤
  mark:    0xc65030,  // 額・目元の朱色マーキング
  dark:    0x1a1a1a,  // 口・鼻の線
  pink:    0xf0b6be,  // 口内のピンク
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(1.5, 1.1, 2.9);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.25, 0.45, 0);
controls.enableDamping = true;

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.0);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = sc.bottom = -6; sc.right = sc.top = 6; sc.far = 40;
scene.add(sun);

/* ---------- helpers ---------- */
function mesh(geo, mat, parent){
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ================= build =================
   単位はメートル1:1。頭頂 約1.05m のちびキャラサイズ。
   構成方針（Blenderリグ前提）:
   - 胴体は頭頂→首S字→とぐろ→尻尾まで「1本の連続チューブメッシュ」
     （エッジループが背骨に沿って並ぶので、そのままスパインボーンを通せる）
   - 目・マーキング・口などの顔パーツは別オブジェクト（頭ボーンに親子付けする想定） */
const model = new THREE.Group();
model.name = 'orochi';
scene.add(model);

const smooth = (c, r=0.7) => new THREE.MeshStandardMaterial({ color:c, roughness:r });
const bodyMat  = smooth(C.body, 0.8);
const faceMat  = smooth(C.face, 0.75);
const patchMat = smooth(C.patch, 0.85);
const eyeMat   = smooth(C.eye, 0.35);
const pupilMat = smooth(C.pupil, 0.3);
const markMat  = smooth(C.mark, 0.8);
const darkMat  = smooth(C.dark, 0.9);
const pinkMat  = smooth(C.pink, 0.8);
const glintMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.2, emissive:0xffffff, emissiveIntensity:0.35 });

/* ---- 頭（独立した球。リグでは頭ボーン担当） ---- */
const HC = new THREE.Vector3(0, 0.80, 0.03);   // 頭の中心
const HR = 0.29;                               // 頭の半径
const head = mesh(new THREE.SphereGeometry(HR, 28, 22), faceMat, model);
head.name = 'head';
head.position.copy(HC);
head.scale.set(1, 1.04, 0.96);

/* ---- 背骨カーブ（あご下 t=0 → 尻尾 t=1。始点は頭の中に埋める） ---- */
const spine = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 0.00, 0.86,  0.02),   // 頭の中（接続部）
  new THREE.Vector3( 0.00, 0.62,  0.06),   // あご下
  new THREE.Vector3( 0.02, 0.46, -0.02),   // 首の反り（S字）
  new THREE.Vector3( 0.02, 0.28,  0.05),   // 胸
  new THREE.Vector3(-0.10, 0.16,  0.01),
  new THREE.Vector3(-0.48, 0.14, -0.14),   // 左へ流れて
  new THREE.Vector3(-0.82, 0.14, -0.44),
  new THREE.Vector3(-0.52, 0.14, -0.74),   // 後ろで折り返し
  new THREE.Vector3( 0.08, 0.15, -0.62),
  new THREE.Vector3( 0.58, 0.13, -0.24),   // 手前へクロス
  new THREE.Vector3( 1.06, 0.10,  0.04),
  new THREE.Vector3( 1.44, 0.06,  0.30),
  new THREE.Vector3( 1.72, 0.04,  0.55),   // 尻尾の先
]);

/* 半径プロファイル: 首→胴→尻尾の先細り */
const RKEYS = [
  [0.000, 0.160], [0.060, 0.130], [0.120, 0.115], [0.180, 0.120], // 首（細く）
  [0.280, 0.140], [0.420, 0.160], [0.580, 0.160],                 // 胸→胴
  [0.720, 0.140], [0.850, 0.100], [0.940, 0.050], [1.000, 0.008], // 尻尾
];
function radiusAt(t){
  for(let i=0; i<RKEYS.length-1; i++){
    const [a, ra] = RKEYS[i], [b, rb] = RKEYS[i+1];
    if(t >= a && t <= b){
      const u = (t-a)/(b-a), s = u*u*(3-2*u);       // smoothstep補間
      return ra + (rb-ra)*s;
    }
  }
  return RKEYS[RKEYS.length-1][1];
}

/* 連続チューブ生成（リング=背骨直交のエッジループ） */
function buildSnake(curve, rings, radial){
  const frames = curve.computeFrenetFrames(rings, false);
  const pos = [], idx = [];
  for(let i=0; i<=rings; i++){
    const t = i/rings;
    const p = curve.getPointAt(t);
    const N = frames.normals[i], B = frames.binormals[i];
    const r = radiusAt(t);
    for(let j=0; j<=radial; j++){
      const a = j/radial * Math.PI*2;
      pos.push(
        p.x + (Math.cos(a)*N.x + Math.sin(a)*B.x) * r,
        p.y + (Math.cos(a)*N.y + Math.sin(a)*B.y) * r,
        p.z + (Math.cos(a)*N.z + Math.sin(a)*B.z) * r);
    }
  }
  for(let i=0; i<rings; i++){
    for(let j=0; j<radial; j++){
      const a = i*(radial+1)+j, b = a+radial+1;
      idx.push(a, b, a+1,  b, b+1, a+1);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}
const body = mesh(buildSnake(spine, 120, 14), bodyMat, model);
body.name = 'body';
/* 尻尾の先の穴をふさぐキャップ */
const capTail = mesh(new THREE.SphereGeometry(0.012, 8, 6), bodyMat, model);
capTail.position.copy(spine.getPointAt(1));

/* ---- 顔パーツ（頭ボーン追従想定の別オブジェクト群） ---- */
const face = new THREE.Group();
face.name = 'face';
model.add(face);

/* 頭表面の方向ベクトル（yaw: 左右, pitch: 上下, 正面=+Z） */
function hdir(yawDeg, pitchDeg){
  const y = yawDeg*Math.PI/180, p = pitchDeg*Math.PI/180;
  return new THREE.Vector3(Math.sin(y)*Math.cos(p), Math.sin(p), Math.cos(y)*Math.cos(p));
}
function onHead(dir, depth=0.95){
  return HC.clone().add(dir.clone().multiplyScalar(HR*depth));
}
/* 表面に貼り付く扁平パーツ。
   向きは「+Z=表面法線 / +Y=表面に沿った上方向」で固定し、
   sx=横幅 sy=縦幅 sz=厚み が見た目どおりに効くようにする */
function facePatch(mat, sx, sy, sz, yaw, pitch, depth=0.97, name=''){
  const m = mesh(new THREE.SphereGeometry(1, 20, 14), mat, face);
  const dir = hdir(yaw, pitch);
  m.position.copy(onHead(dir, depth));
  m.scale.set(sx, sy, sz);
  const z = dir.clone();
  const y = new THREE.Vector3(0,1,0).addScaledVector(z, -z.y).normalize(); // 上を接平面へ射影
  const x = new THREE.Vector3().crossVectors(y, z);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  if(name) m.name = name;
  return m;
}

/* 目: 赤い虹彩＋暗赤の瞳孔＋白ハイライト */
for(const s of [-1, 1]){
  facePatch(eyeMat,   0.085, 0.100, 0.035, 34*s,  0, 0.95, s<0?'eye_L':'eye_R');
  facePatch(pupilMat, 0.050, 0.062, 0.022, 34*s,  0, 1.005);
  facePatch(glintMat, 0.022, 0.026, 0.013, 29*s,  7, 1.045);
  /* 目元の朱の炎マーキング（外側やや上・内側下） */
  facePatch(markMat, 0.100, 0.036, 0.020, 58*s,  9, 0.99);
  facePatch(markMat, 0.050, 0.020, 0.014, 23*s, -13, 0.99);
}

/* 額の朱の縦すじ（眉間から頭頂へ） */
facePatch(markMat, 0.048, 0.150, 0.026, 0, 46, 0.955, 'mark_forehead');

/* 鼻先の点 */
facePatch(darkMat, 0.009, 0.009, 0.008,  7, -18, 0.995);
facePatch(darkMat, 0.009, 0.009, 0.008, -7, -18, 0.995);

/* 口: にっこりアーク（トーラス弧）＋口内のピンク */
{
  const arc = Math.PI*0.78;
  const mouth = mesh(new THREE.TorusGeometry(0.095, 0.0065, 8, 28, arc), darkMat, face);
  mouth.name = 'mouth';
  const dir = hdir(0, -26);
  mouth.position.copy(onHead(dir, 0.94));
  mouth.lookAt(onHead(dir, 3));
  mouth.rotateZ(Math.PI + (Math.PI-arc)/2);  // 弧を下側（笑い口）に
  facePatch(pinkMat, 0.030, 0.014, 0.010, 3, -33, 0.985, 'mouth_inner');
}

/* ---- ひし形のうろこハイライト ---- */
function diamond(px, py, pz, size, tiltY=0){
  const m = mesh(new THREE.BoxGeometry(size, size, 0.006), patchMat, model);
  m.position.set(px, py, pz);
  m.rotation.set(0, tiltY, Math.PI/4);       // 45°回転でひし形に
  return m;
}
/* 頭頂左のパッチ */
{
  const g = new THREE.Group(); model.add(g);
  for(const [yaw, pitch, s] of [[-30,62,0.055],[-42,55,0.045],[-33,50,0.045],[-44,66,0.04]]){
    const d = diamond(0,0,0, s);
    const dir = hdir(yaw, pitch);
    d.position.copy(onHead(dir, 1.0));
    d.lookAt(onHead(dir, 3));
    d.rotateZ(Math.PI/4);
  }
}
/* 胸のパッチ（首前面） */
for(const [t, ox, oy, s] of [[0.205,-0.03,0.03,0.05],[0.215,0.035,0.01,0.05],[0.23,-0.01,-0.02,0.045],[0.245,0.05,-0.01,0.035]]){
  const p = spine.getPointAt(t), r = radiusAt(t);
  diamond(p.x+ox, p.y+oy, p.z + r*0.97, s);
}
/* 胴（手前クロス部）のパッチ */
for(const [t, s] of [[0.78,0.045],[0.80,0.04],[0.82,0.032]]){
  const p = spine.getPointAt(t), r = radiusAt(t);
  diamond(p.x, p.y + r*0.5, p.z + r*0.82, s, 0.5);
}

/* ---------- ground（GLBには含まれない） ---------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48),
  new THREE.MeshStandardMaterial({ color:0xeceae4, roughness:1 }));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ================= GLB export (Unity: glTFast / Blender) ================= */
{
  const b = document.createElement('button');
  b.textContent = 'GLB書き出し';
  b.style.background = '#4a6b3a';
  b.style.borderColor = '#6f9a58';
  b.style.color = '#fff';
  b.onclick = () => {
    /* キャラはスムーズシェーディングのまま書き出す（法線は生成済み） */
    const clone = model.clone(true);
    clone.traverse(o => {
      if(o.isMesh){
        o.geometry = o.geometry.clone();
        o.castShadow = o.receiveShadow = false;
      }
    });
    new GLTFExporter().parse(clone, (buf) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], { type:'model/gltf-binary' }));
      a.download = 'orochi.glb';
      a.click();
      URL.revokeObjectURL(a.href);
    }, (err) => alert('書き出し失敗: ' + err), { binary:true });
  };
  document.getElementById('vars').appendChild(b);
}

/* ================= loop ================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
