<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>2-01 Castle — Three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f4f2ee;}
  #info{position:fixed;top:10px;left:12px;font:12px/1.6 sans-serif;color:#555;user-select:none;}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info">2-01 castle — drag: rotate / wheel: zoom / right-drag: pan</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- palette (picked from 2-01_castle_front.png) ---------- */
const C = {
  bg:      0xf4f2ee,
  roof:    0x243244,   // dark navy roof
  roofEdge:0x161d2a,   // eave / ridge dark line
  teal:    0x5fd2b8,   // accent line under eaves
  wall:    0xe9e4d8,   // cream plaster
  wood:    0x22252d,   // dark timber
  wood2:   0x3a3e48,   // lighter timber / lattice
  stone:   0x777d82,
  stoneLn: 0x565b60,
  gold:    0xe8c84c,
  glow:    0xf2c14e,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 16, 46);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 13, 0);
controls.enableDamping = true;

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
sun.position.set(18, 40, 28);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = sc.bottom = -30; sc.right = sc.top = 30; sc.far = 120;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.35);
fill.position.set(-20, 12, -18);
scene.add(fill);

/* ---------- materials ---------- */
const M = {
  roof : new THREE.MeshStandardMaterial({ color:C.roof, roughness:0.85, flatShading:true }),
  roofEdge: new THREE.MeshStandardMaterial({ color:C.roofEdge, roughness:0.9 }),
  teal : new THREE.MeshStandardMaterial({ color:C.teal, emissive:C.teal, emissiveIntensity:0.35, roughness:0.5 }),
  wall : new THREE.MeshStandardMaterial({ color:C.wall, roughness:0.95 }),
  wood : new THREE.MeshStandardMaterial({ color:C.wood, roughness:0.9 }),
  wood2: new THREE.MeshStandardMaterial({ color:C.wood2, roughness:0.9 }),
  gold : new THREE.MeshStandardMaterial({ color:C.gold, emissive:0xb8922a, emissiveIntensity:0.55, roughness:0.35 }),
  glow : new THREE.MeshStandardMaterial({ color:C.glow, emissive:C.glow, emissiveIntensity:1.2 }),
};

const castle = new THREE.Group();
scene.add(castle);

function box(w,h,d, mat, x,y,z, parent=castle){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ---------- curved hip roof (concave slope + upturned corners) ---------- */
function makeRoof(baseW, baseD, topW, topD, h, lift=h*0.28){
  const SEG = 10, RINGS = 9;
  const pos = [];
  const ring = [];
  for(let r=0; r<=RINGS; r++){
    const t = r/RINGS;
    const k = Math.pow(t, 1.7);              // concave profile
    const hw = THREE.MathUtils.lerp(baseW/2, topW/2, k);
    const hd = THREE.MathUtils.lerp(baseD/2, topD/2, k);
    const y0 = h * t;
    const pts = [];
    // perimeter: 4 sides x SEG points, CCW from front-left
    for(let s=0; s<4; s++){
      for(let i=0; i<SEG; i++){
        const f = i/SEG;
        let x, z, u;
        if(s===0){ x=-hw+f*2*hw; z= hd; u=Math.abs(x/hw); }       // front
        else if(s===1){ x= hw; z= hd-f*2*hd; u=Math.abs(z/hd); }  // right
        else if(s===2){ x= hw-f*2*hw; z=-hd; u=Math.abs(x/hw); }  // back
        else { x=-hw; z=-hd+f*2*hd; u=Math.abs(z/hd); }           // left
        const y = y0 + lift * Math.pow(u,3) * Math.pow(1-t,2);    // corner upturn
        pts.push(x, y, z);
      }
    }
    ring.push(pos.length/3);
    pos.push(...pts);
  }
  const N = SEG*4;
  const idx = [];
  for(let r=0; r<RINGS; r++){
    const a0 = ring[r], b0 = ring[r+1];
    for(let i=0; i<N; i++){
      const a=a0+i, a2=a0+(i+1)%N, b=b0+i, b2=b0+(i+1)%N;
      idx.push(a, a2, b,  a2, b2, b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();

  const grp = new THREE.Group();
  const mesh = new THREE.Mesh(g, M.roof);
  mesh.castShadow = mesh.receiveShadow = true;
  grp.add(mesh);

  // dark underside board
  box(baseW*0.96, 0.18, baseD*0.96, M.roofEdge, 0, 0.02, 0, grp);

  // teal accent line under the eaves (front / back / sides)
  const tw = 0.12, inset = 0.985;
  box(baseW*inset, tw, tw, M.teal, 0, -0.06,  baseD/2*inset, grp);
  box(baseW*inset, tw, tw, M.teal, 0, -0.06, -baseD/2*inset, grp);
  box(tw, tw, baseD*inset, M.teal,  baseW/2*inset, -0.06, 0, grp);
  box(tw, tw, baseD*inset, M.teal, -baseW/2*inset, -0.06, 0, grp);

  // ridge beam
  if(topW > 0.5){
    box(topW+0.5, 0.32, Math.max(topD,0.4)+0.45, M.roofEdge, 0, h+0.1, 0, grp);
  }
  return grp;
}

/* ---------- front gable (chidori-hafu) ---------- */
function makeGable(w, h, depth){
  const grp = new THREE.Group();
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, 0); shape.lineTo(w/2, 0); shape.lineTo(0, h); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled:false });
  const tri = new THREE.Mesh(geo, M.roof);
  tri.castShadow = true;
  grp.add(tri);
  // cream infill triangle
  const s2 = new THREE.Shape();
  s2.moveTo(-w/2*0.7, 0); s2.lineTo(w/2*0.7, 0); s2.lineTo(0, h*0.7); s2.closePath();
  const inner = new THREE.Mesh(new THREE.ExtrudeGeometry(s2, { depth:0.1, bevelEnabled:false }), M.wall);
  inner.position.z = depth;
  grp.add(inner);
  // barge boards
  const len = Math.hypot(w/2, h);
  const bl = box(len, 0.22, depth+0.15, M.roofEdge, -w/4, h/2, depth/2, grp);
  bl.rotation.z =  Math.atan2(h, w/2);
  const br = box(len, 0.22, depth+0.15, M.roofEdge,  w/4, h/2, depth/2, grp);
  br.rotation.z = -Math.atan2(h, w/2);
  return grp;
}

/* ---------- lattice window band ---------- */
function addLattice(w, h, x, y, z, parent){
  box(w, h, 0.15, new THREE.MeshStandardMaterial({ color:0x14161c, roughness:1 }), x, y, z, parent);
  const bars = Math.max(3, Math.round(w/0.45));
  for(let i=0; i<bars; i++){
    const bx = x - w/2 + (i+0.5)*(w/bars);
    box(0.09, h, 0.2, M.wood2, bx, y, z+0.01, parent);
  }
}

/* ---------- one storey: timber-framed wall + windows ---------- */
function addTier(w, d, wallH, y, { windows=3, latticeBand=false } = {}){
  const g = new THREE.Group(); g.position.y = y; castle.add(g);
  box(w, wallH, d, M.wall, 0, wallH/2, 0, g);
  // horizontal beams top & bottom
  box(w+0.3, 0.45, d+0.3, M.wood, 0, 0.22, 0, g);
  box(w+0.3, 0.45, d+0.3, M.wood, 0, wallH-0.22, 0, g);
  // corner posts
  for(const sx of [-1,1]) for(const sz of [-1,1])
    box(0.5, wallH, 0.5, M.wood, sx*(w/2-0.1), wallH/2, sz*(d/2-0.1), g);

  const zf = d/2 + 0.03, wy = wallH*0.52;
  if(latticeBand){
    addLattice(w*0.62, wallH*0.55, 0, wy, zf, g);
    addLattice(w*0.62, wallH*0.55, 0, wy, -zf, g);
  } else {
    const span = w*0.72, step = span/windows;
    for(let i=0; i<windows; i++){
      const wx = -span/2 + step*(i+0.5);
      addLattice(step*0.55, wallH*0.42, wx, wy,  zf, g);
      addLattice(step*0.55, wallH*0.42, wx, wy, -zf, g);
    }
  }
  return g;
}

/* ================= build ================= */

/* --- stone base: truncated pyramid with stone-pattern texture --- */
function stoneTexture(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#'+new THREE.Color(C.stone).getHexString();
  ctx.fillRect(0,0,512,512);
  ctx.strokeStyle = '#'+new THREE.Color(C.stoneLn).getHexString();
  ctx.lineWidth = 5; ctx.lineJoin = 'round';
  const rnd = (a,b)=>a+Math.random()*(b-a);
  for(let gy=0; gy<6; gy++) for(let gx=0; gx<6; gx++){
    const cx = gx*85+rnd(20,65), cy = gy*85+rnd(20,65);
    ctx.beginPath();
    const n = 6, r0 = rnd(34,50);
    for(let i=0; i<=n; i++){
      const a = i/n*Math.PI*2 + rnd(-0.2,0.2);
      const r = r0*rnd(0.8,1.15);
      i===0 ? ctx.moveTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r)
            : ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    }
    ctx.closePath(); ctx.stroke();
  }
  const tx = new THREE.CanvasTexture(cv);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  tx.repeat.set(2,1);
  return tx;
}
const baseH = 6;
const baseGeo = new THREE.CylinderGeometry(13*Math.SQRT1_2*1.08, 24*Math.SQRT1_2*1.08, baseH, 4, 1);
const base = new THREE.Mesh(baseGeo,
  new THREE.MeshStandardMaterial({ map:stoneTexture(), roughness:1 }));
base.rotation.y = Math.PI/4;
base.position.y = baseH/2;
base.castShadow = base.receiveShadow = true;
castle.add(base);

/* --- gate on the stone base --- */
{
  const g = new THREE.Group(); g.position.set(0, 0, 8.1); castle.add(g);
  box(5.2, 4.6, 1.2, M.wood, 0, 2.3, 0, g);                       // gate house
  box(1.85, 3.1, 0.2, M.wood2, -0.98, 1.7, 0.62, g);              // doors
  box(1.85, 3.1, 0.2, M.wood2,  0.98, 1.7, 0.62, g);
  box(0.18, 0.5, 0.05, new THREE.MeshStandardMaterial({color:0x14161c}), -0.98, 1.8, 0.74, g);
  box(0.18, 0.5, 0.05, new THREE.MeshStandardMaterial({color:0x14161c}),  0.98, 1.8, 0.74, g);
  const gr = makeRoof(7.2, 3.4, 2.4, 0.3, 1.3, 0.5);              // gate roof
  gr.position.y = 4.6; g.add(gr);
  box(6.4, 0.35, 2.6, M.wood, 0, 4.35, 0, g);                     // lintel
  // glowing lanterns
  for(const sx of [-1,1]){
    box(0.55, 1.0, 0.3, M.wood, sx*2.15, 3.2, 0.65, g);
    box(0.32, 0.62, 0.12, M.glow, sx*2.15, 3.2, 0.82, g);
  }
}

/* --- 4 storeys, bottom to top --- */
let y = baseH;

/* tier 1 (largest) */
addTier(13, 10.5, 3.4, y, { windows:4 });
y += 3.4;
let roof = makeRoof(18.5, 14.5, 6.5, 0.3, 2.7); roof.position.y = y; castle.add(roof);
let gable = makeGable(6.4, 2.3, 0.4); gable.position.set(0, y+0.55, 6.2); castle.add(gable);
y += 2.4;

/* tier 2 */
addTier(10.4, 8.4, 3.1, y, { windows:3 });
y += 3.1;
roof = makeRoof(15.2, 12.0, 5.4, 0.3, 2.5); roof.position.y = y; castle.add(roof);
gable = makeGable(5.6, 2.1, 0.4); gable.position.set(0, y+0.5, 5.1); castle.add(gable);
y += 2.3;

/* tier 3 — wide lattice band storey */
addTier(8.4, 6.9, 2.9, y, { latticeBand:true });
y += 2.9;
roof = makeRoof(12.6, 10.0, 4.6, 0.3, 2.4); roof.position.y = y; castle.add(roof);
gable = makeGable(4.8, 1.9, 0.4); gable.position.set(0, y+0.5, 4.3); castle.add(gable);
y += 2.2;

/* tier 4 — top storey with the golden ring emblem */
const top = addTier(6.4, 5.4, 3.2, y, { windows:2 });
{
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.28, 16, 40), M.gold);
  ring.position.set(0, 1.75, 5.4/2 + 0.25);
  ring.castShadow = true;
  top.add(ring);
  const ringB = ring.clone(); ringB.position.z = -5.4/2 - 0.25; top.add(ringB);
}
y += 3.2;
roof = makeRoof(9.6, 8.0, 0.6, 0.4, 3.1, 1.0); roof.position.y = y; castle.add(roof);
y += 3.1;

/* spire */
box(0.45, 0.9, 0.45, M.roofEdge, 0, y+0.4, 0);
const spire = new THREE.Mesh(new THREE.ConeGeometry(0.32, 1.7, 8), M.roofEdge);
spire.position.y = y + 1.7; spire.castShadow = true; castle.add(spire);
for(let i=0; i<3; i++){
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.26-0.05*i, 12, 10), M.roofEdge);
  s.position.y = y + 0.95 + i*0.42;
  castle.add(s);
}

/* ground */
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 48),
  new THREE.MeshStandardMaterial({ color:0xeceae4, roughness:1 }));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- loop ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
